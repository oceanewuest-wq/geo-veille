name: Digest quotidien

on:
  schedule:
    # Cron en UTC : 05h00 UTC = 07h00 Paris (été) / 06h00 (hiver)
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python veille.py

      - name: Publier docs/index.html
        run: |
          git config user.name "geo-veille-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Digest du $(date -u +%Y-%m-%d)"
          git push
